[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integration: precisa de Postgres real (ver tests/integration/conftest_db.py)
addopts =
    -ra --strict-markers
    --cov=sentinela --cov-report=term-missing --cov-report=xml --cov-fail-under=85
    # Piso medido após a rearquitetura multi-tenant (cobertura real: ~87%,
    # ver `pytest --cov-report=term-missing`), com uma margem pequena --
    # não uma meta aspiracional. sentinela/monitor.py (0%, loop de
    # `watchdog` de longa duração, sem teste de unidade prático) e trechos
    # de sentinela/cli.py/config.py (branches de erro de configuração) são
    # os maiores contribuintes do "Miss" -- candidatos naturais pra fase
    # seguinte de testes, não bugs desta fase.
